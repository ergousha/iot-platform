name: Zizmor Security Checks

on:
  push:
    branches: [ main ]
    paths:
      - '.github/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/**'

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Zizmor Security Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pipx ships with the runner image; the version is pinned.
      - name: Install zizmor
        run: pipx install zizmor==1.31.1

      # The token (read-only) enables the online audits: impostor commits,
      # known-vulnerable actions, ref confusion.
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor .github/
